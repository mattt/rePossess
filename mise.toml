[tasks.build]
description = "Build the Swift package"
run = "swift build"

[tasks.test]
description = "Run the Swift package tests"
run = "swift test"

[tasks.lint]
description = "Lint the Swift sources with swift format"
run = "swift format lint --strict --recursive Package.swift Sources Tests"

[tasks.format]
description = "Format the Swift sources with swift format"
run = "swift format --in-place --recursive Package.swift Sources Tests"

[tasks.check]
description = "Lint, build, and test"
depends = ["lint", "build", "test"]

[tasks."build:release"]
description = "Build the release binary and sign it with a stable identity and identifier"
# An ad hoc signature changes with every build, so the Keychain treats each build as a new program
# and asks again for the device token. A certificate signature with a fixed identifier
# gives every build the same designated requirement.
run = """
set -eu
identity="${REPOSSESS_SIGNING_IDENTITY:-Apple Development: Mattt Zmuda (S3NBB5643Q)}"
swift build -c release --product repossess
binary="$(swift build -c release --show-bin-path)/repossess"
codesign --force --sign "$identity" --identifier co.dododo.repossess --timestamp=none "$binary"
codesign --verify --strict "$binary"
codesign --display --requirements - "$binary"
echo "Signed $binary"
"""

[tasks."build:app"]
description = "Build rePossess.app with the repossess command inside, and sign both"
run = "scripts/app.sh build"

[tasks."sign:app"]
description = "Sign the assembled rePossess.app again"
run = "scripts/app.sh sign"

[tasks."run:app"]
description = "Open rePossess.app; pass --library <folder> and --no-keychain after --"
run = "scripts/app.sh run"

[tasks."quit:app"]
description = "Quit rePossess.app"
run = "scripts/app.sh quit"
